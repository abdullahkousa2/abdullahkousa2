<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="title desc">
  <title id="title">Abdullah Kousa — AI / ML Engineer</title>
  <desc id="desc">Banner with a training-loss curve from the SQLForge fine-tune falling from 1.08 to 0.18.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101d"/>
      <stop offset="1" stop-color="#121d36"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="card">
      <rect width="1000" height="260" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .draw {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 2.6s cubic-bezier(.4, 0, .2, 1) .4s forwards;
    }
    .fade { opacity: 0; animation: fade .8s ease 2.6s forwards; }
    .pulse { transform-origin: 945px 183px; animation: pulse 2.2s ease-out 3s infinite; opacity: 0; }

    .line { opacity: 0; animation: cycle 12s ease infinite both; }
    .l2 { animation-delay: 4s; }
    .l3 { animation-delay: 8s; }

    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes fade  { to { opacity: 1; } }
    @keyframes pulse {
      0%   { opacity: .55; transform: scale(1); }
      100% { opacity: 0;   transform: scale(3.4); }
    }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(6px); }
      4%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .draw  { animation: none; stroke-dashoffset: 0; }
      .fade  { animation: none; opacity: 1; }
      .pulse { animation: none; opacity: 0; }
      .line  { animation: none; }
      .l1    { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#dots)"/>
    <rect width="1000" height="260" fill="url(#glow)"/>

    <!-- left: identity -->
    <text x="56" y="66" class="mono" font-size="14" fill="#5b6b88"><tspan fill="#34d399">$</tspan> whoami</text>
    <text x="54" y="128" class="sans" font-size="58" font-weight="700" fill="#f4f7fc" letter-spacing="-1.5">Abdullah Kousa</text>
    <text x="56" y="164" class="sans" font-size="22" font-weight="600" fill="#b9c6dc">AI / ML Engineer</text>

    <rect x="56" y="186" width="34" height="2" rx="1" fill="url(#curve)"/>

    <g class="mono" font-size="15" fill="#8fa1bf">
      <text x="56" y="218" class="line l1">fine-tunes small LLMs and measures them properly</text>
      <text x="56" y="218" class="line l2">builds agents that write and run their own code</text>
      <text x="56" y="218" class="line l3">ships every model with a demo you can click</text>
    </g>

    <!-- right: loss curve -->
    <g class="mono" font-size="12">
      <text x="630" y="46" fill="#8fa1bf">train loss</text>
      <text x="950" y="46" fill="#34d399" text-anchor="end" class="fade">Spider exec acc 57.4% → 65.6%</text>

      <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
        <line x1="620" y1="90"  x2="955" y2="90"/>
        <line x1="620" y1="125" x2="955" y2="125"/>
        <line x1="620" y1="160" x2="955" y2="160"/>
      </g>
      <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
        <line x1="620" y1="58"  x2="620" y2="195"/>
        <line x1="620" y1="195" x2="955" y2="195"/>
      </g>

      <text x="612" y="74"  fill="#f59e0b" text-anchor="end">1.08</text>
      <text x="612" y="187" fill="#34d399" text-anchor="end">0.18</text>

      <path class="fade" fill="url(#area)"
            d="M630 70 L648 94 L664 101 L682 123 L700 127 L718 145 L736 147 L756 159 L776 161 L798 169 L820 170 L844 175 L868 176 L894 180 L920 181 L945 183 L945 195 L630 195 Z"/>
      <path class="draw" pathLength="1" fill="none" stroke="url(#curve)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"
            d="M630 70 L648 94 L664 101 L682 123 L700 127 L718 145 L736 147 L756 159 L776 161 L798 169 L820 170 L844 175 L868 176 L894 180 L920 181 L945 183"/>

      <circle class="pulse" cx="945" cy="183" r="4" fill="#34d399"/>
      <circle class="fade" cx="945" cy="183" r="4" fill="#34d399"/>

      <text x="630" y="220" fill="#5b6b88">sqlforge · QLoRA on Qwen2.5-Coder-1.5B · one 8 GB GPU</text>
    </g>
  </g>
</svg>
